<title>Dock to Dashboard</title>

<style id="app-style">
/* Layout: freight-yard palette. Five container colours drive cards, a striped colour band sits under the header, the hero photo has a hard offset colour block behind it. */
:root {
  --bg: #f3f5fb;
  --surface: #ffffff;
  --ink: #0e1a2b;
  --muted: #535f73;
  --line: #d6dce8;
  --accent: #2447c9;
  --accent-fg: #ffffff;
  --c1: #0b7a7c; --c1fg: #ffffff;
  --c2: #f26a1b; --c2fg: #1a0e04;
  --c3: #ffc233; --c3fg: #1a1404;
  --c4: #3a63f0; --c4fg: #ffffff;
  --c5: #d6247a; --c5fg: #ffffff;
  --code-bg: #0e1a2b; --code-ink: #dbe5ef; --code-key: #7fd4e6; --code-fn: #ffb08f; --code-dim: #7d90a3;
  --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1320; --surface: #141f31; --ink: #ecf0f7; --muted: #9aa8bd; --line: #26344b;
    --accent: #8aa4ff; --accent-fg: #0a1330;
    --code-bg: #08101b; --code-dim: #6f8399;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1320; --surface: #141f31; --ink: #ecf0f7; --muted: #9aa8bd; --line: #26344b;
  --accent: #8aa4ff; --accent-fg: #0a1330;
  --code-bg: #08101b; --code-dim: #6f8399;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  margin: 0;
}
.wrap { max-width: 1100px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.3rem, 6vw, 4rem); font-weight: 800; }
h1.page { font-size: clamp(2rem, 5vw, 3rem); }
h2 { font-size: clamp(1.6rem, 3.6vw, 2.3rem); font-weight: 800; }
h3 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--c2); outline-offset: 2px; }
.label { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.c0 { --card: var(--c1); --card-fg: var(--c1fg); }
.c1 { --card: var(--c2); --card-fg: var(--c2fg); }
.c2 { --card: var(--c3); --card-fg: var(--c3fg); }
.c3 { --card: var(--c4); --card-fg: var(--c4fg); }
.c4 { --card: var(--c5); --card-fg: var(--c5fg); }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 20px 16px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em; }
.brand small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav a { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; text-decoration: none; color: var(--ink); padding: 8px 14px; border-radius: 99px; border: 2px solid transparent; }
nav a:hover { border-color: var(--line); }
nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.band { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--c1) 0 20%, var(--c2) 20% 40%, var(--c3) 40% 60%, var(--c4) 60% 80%, var(--c5) 80% 100%); }

.view { padding-block: 40px 8px; }
.section { margin-top: 72px; display: grid; gap: 24px; }
.sechead { display: grid; gap: 8px; }
.tagline { display: inline-block; justify-self: start; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border-radius: 3px; background: var(--card, var(--c1)); color: var(--card-fg, var(--c1fg)); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 48px; align-items: center; }
.hero .lead { font-size: 1.15rem; color: var(--muted); max-width: 34rem; margin-top: 20px; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.photo { position: relative; aspect-ratio: 4 / 5; width: 100%; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--c1); color: var(--c1fg); display: grid; place-items: center; min-width: 0; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .initials { font-family: var(--font-display); font-weight: 800; font-size: 5rem; letter-spacing: -0.04em; }
.photo-btn { position: absolute; left: 10px; bottom: 10px; }
.hero .photo { max-width: 420px; justify-self: center; box-shadow: 14px 14px 0 var(--c3); }
.photo.wide { aspect-ratio: 16 / 9; border-radius: 0; }
.photo.sq { aspect-ratio: 1 / 1; }

.btn { display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 0.98rem; text-decoration: none; padding: 11px 20px; border-radius: 6px; border: 2px solid var(--ink); cursor: pointer; background: transparent; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.small { padding: 6px 12px; font-size: 0.82rem; background: var(--surface); }
.btn.danger.armed { background: var(--c5); border-color: var(--c5); color: var(--c5fg); }
.btn:hover { transform: translateY(-1px); }

.waybill { background: var(--code-bg); color: var(--code-ink); border-radius: 8px; position: relative; min-width: 0; margin-top: 40px; }
.waybill .bar { display: flex; justify-content: space-between; gap: 8px; padding: 10px 16px; border-bottom: 1px dashed var(--code-dim); font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--code-dim); }
pre.code { margin: 0; padding: 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.65; color: var(--code-ink); background: var(--code-bg); border-radius: 6px; white-space: pre; }
.k { color: var(--code-key); } .f { color: var(--code-fn); } .c { color: var(--code-dim); }
.stamp { position: absolute; right: 14px; bottom: 14px; font-family: var(--font-display); font-weight: 800; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c3); border: 2px solid var(--c3); padding: 3px 10px; border-radius: 3px; transform: rotate(-6deg); background: var(--code-bg); }

/* skills */
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.skill { background: var(--surface); border: 1.5px solid var(--line); border-top: 8px solid var(--card); border-radius: 6px; padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.skill .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.skill p { font-size: 0.95rem; color: var(--muted); }
.pill { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; white-space: nowrap; border: 0; }
.pill.s0 { background: var(--c1); color: var(--c1fg); }
.pill.s1 { background: var(--c2); color: var(--c2fg); }
.pill.s2 { background: var(--c4); color: var(--c4fg); }
.pill.tag { background: transparent; border: 1.5px solid var(--card); color: var(--ink); }
button.pill { cursor: pointer; }

.model { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 520px; font-family: var(--font-mono); font-size: 0.78rem; }
.model div { border: 2px solid var(--line); background: var(--surface); padding: 12px 8px; text-align: center; border-radius: 4px; overflow-wrap: anywhere; }
.model .d1 { border-color: var(--c2); } .model .d2 { border-color: var(--c3); } .model .d3 { border-color: var(--c4); } .model .d4 { border-color: var(--c5); }
.model .fact { background: var(--c1); color: var(--c1fg); border-color: var(--c1); font-weight: 500; }
.model .gap { border: 0; background: transparent; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; }

/* projects */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-mono); font-size: 0.78rem; padding: 7px 14px; border: 2px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px; }
.project { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; align-content: start; min-width: 0; }
.strip { height: 22px; background-color: var(--card); background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.16) 0 3px, transparent 3px 12px); }
.project .in { padding: 20px 22px 22px; display: grid; gap: 12px; min-width: 0; }
.project .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.project p.d { color: var(--muted); font-size: 0.98rem; }
.project details { border-top: 1px dashed var(--line); padding-top: 12px; }
.project summary { font-family: var(--font-display); font-weight: 700; cursor: pointer; }
.project details > div { display: grid; gap: 12px; margin-top: 12px; }
.project pre.code { font-size: 0.74rem; padding: 12px; }
.project .photo { border-radius: 0; }

/* blog */
.posts { display: grid; border-top: 3px solid var(--ink); }
.post { border-bottom: 1px solid var(--line); padding-block: 22px; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 28px; }
.post time { font-family: var(--font-mono); font-size: 0.78rem; color: var(--card); padding-top: 6px; font-weight: 500; }
.post .body { display: grid; gap: 10px; min-width: 0; }
.post .more { display: grid; gap: 12px; max-width: 42rem; }
.post .excerpt { color: var(--muted); max-width: 42rem; }
.link-btn { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent); font: 600 0.95rem var(--font-body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* about */
.about { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.about .text { display: grid; gap: 16px; }
.about .photo { max-width: 380px; box-shadow: 12px 12px 0 var(--c5); margin-bottom: 12px; }
.timeline { display: grid; border-left: 3px solid var(--ink); }
.timeline .it { padding: 0 0 20px 22px; position: relative; display: grid; gap: 2px; }
.timeline .it::before { content: ""; position: absolute; left: -10px; top: 6px; width: 16px; height: 16px; background: var(--card); border-radius: 50%; border: 3px solid var(--bg); }
.timeline b { font-family: var(--font-display); }
.timeline span.d { color: var(--muted); font-size: 0.95rem; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 16px; }
.gallery figure { margin: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; min-width: 0; }
.gallery figcaption { padding: 10px 12px; font-size: 0.9rem; color: var(--muted); }

/* contact */
.contacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.contact { background: var(--surface); border: 1.5px solid var(--line); border-top: 8px solid var(--card); border-radius: 6px; padding: 20px; display: grid; gap: 8px; min-width: 0; }
.contact .val { font-family: var(--font-mono); font-size: 0.9rem; overflow-wrap: anywhere; }
.contact .btn { justify-self: start; }
.note { font-size: 0.9rem; color: var(--muted); }
footer.foot { margin-top: 72px; padding-top: 20px; border-top: 3px solid var(--ink); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 0.88rem; color: var(--muted); }

/* edit mode */
.ed { outline: 2px dashed var(--c2); outline-offset: 3px; border-radius: 2px; min-height: 1.2em; cursor: text; }
.ed:empty::before { content: attr(data-ph); color: var(--muted); opacity: 0.7; }
.ed.ml { white-space: pre-wrap; }
pre.code.ed { white-space: pre-wrap; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--ink); color: var(--bg); display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); font-size: 0.9rem; }
#bar .msg { margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
#bar .btn { border-color: var(--bg); color: var(--bg); padding: 7px 14px; font-size: 0.88rem; }
#bar .btn.primary { background: var(--c3); border-color: var(--c3); color: var(--c3fg); }
#bar textarea { width: 100%; height: 90px; font: 0.75rem var(--font-mono); }

@media (max-width: 820px) {
  .hero, .two, .about { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .post { grid-template-columns: minmax(0, 1fr); }
  .post time { padding-top: 0; }
  .hero .photo { box-shadow: 10px 10px 0 var(--c3); max-width: 320px; }
}
@media (prefers-reduced-motion: reduce) { .btn:hover { transform: none; } }
</style>

  var barEl = document.getElementById("bar");
  var edit = false, canEdit = false, dirty = false, art = null, assets = null;
  var view = "home", filter = "all", openPosts = {}, msgText = "", backup = "";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function get(p) { return p.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, data); }
  function set(p, v) {
    var ks = p.split("."), last = ks.pop();
    var o = ks.reduce(function (o, k) { return o[k]; }, data);
    o[last] = v; dirty = true;
  }
  function initials() {
    var s = String(data.name || "").replace(/[^A-Za-z\s]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase();
    return s || "ME";
  }

  // text helpers
  function T(path, tag, cls, ph) {
    var v = get(path) || "";
    if (edit) return "<" + tag + ' class="' + (cls || "") + ' ed" contenteditable="true" spellcheck="true" data-path="' + path + '" data-ph="' + esc(ph || "Type here") + '">' + esc(v) + "</" + tag + ">";
    return "<" + tag + ' class="' + (cls || "") + '">' + esc(v) + "</" + tag + ">";
  }
  function ML(path, cls, ph) {
    var v = get(path) || "";
    if (edit) return '<div class="' + (cls || "") + ' ed ml" contenteditable="true" spellcheck="true" data-path="' + path + '" data-ph="' + esc(ph || "Type here") + '">' + esc(v) + "</div>";
    return v.split(/\n\s*\n/).filter(function (x) { return x.trim(); }).map(function (p) { return '<p class="' + (cls || "") + '">' + esc(p) + "</p>"; }).join("");
  }
  function hlLine(line) {
    var i = line.indexOf("--"), code = i < 0 ? line : line.slice(0, i), com = i < 0 ? "" : line.slice(i);
    code = esc(code)
      .replace(/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|LEFT JOIN|JOIN|ON|AS|WITH|OVER|PARTITION BY|CASE|WHEN|THEN|ELSE|END|HAVING|DESC|ASC|IS NOT NULL|IS NULL|AND|OR|NOT|IN|LIMIT|DISTINCT|UNION)\b/g, '<span class="k">$1</span>')
      .replace(/\b(COUNT|AVG|SUM|ROUND|DATEDIFF|ROW_NUMBER|MIN|MAX|COALESCE|NULLIF)(?=\()/g, '<span class="f">$1</span>');
    return code + (com ? '<span class="c">' + esc(com) + "</span>" : "");
  }
  function CODE(path, ph) {
    var v = get(path) || "";
    if (edit) return '<pre class="code ed ml" contenteditable="true" spellcheck="false" data-path="' + path + '" data-ph="' + esc(ph || "Paste SQL here (optional)") + '">' + esc(v) + "</pre>";
    if (!v.trim()) return "";
    return '<pre class="code">' + v.split("\n").map(hlLine).join("\n") + "</pre>";
  }
  function PHOTO(path, cls, opt, ph) {
    var id = get(path);
    if (!id && !edit && opt) return "";
    var inner = (ph ? '<span class="initials">' + esc(ph) + "</span>" : "") + (id ? '<img src="' + esc(id) + '" alt="" loading="lazy" onerror="this.remove()">' : "");
    var btn = edit ? '<button class="btn small photo-btn" data-act="photo" data-path="' + path + '">' + (id ? "Change photo" : "Add photo") + "</button>" : "";
    return '<div class="photo ' + (cls || "") + '">' + inner + btn + "</div>";
  }
  function tools(list, i, n) {
    if (!edit) return "";
    return '<div class="tools"><button class="btn small" data-act="up" data-list="' + list + '" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + '>Move up</button>' +
      '<button class="btn small" data-act="down" data-list="' + list + '" data-i="' + i + '"' + (i === n - 1 ? " disabled" : "") + '>Move down</button>' +
      '<button class="btn small danger" data-act="del" data-list="' + list + '" data-i="' + i + '">Delete</button></div>';
  }
  function addBtn(act, label) { return edit ? '<div class="addrow"><button class="btn small" data-act="' + act + '">' + label + "</button></div>" : ""; }
  function cc(i) { return "c" + (i % 5); }

  // views
  function vHome() {
    var h = '<div class="hero"><div>' +
      T("hero.eyebrow", "p", "label", "Small line above the headline") +
      '<h1 style="margin-top:12px">' + T("hero.headline", "span", "", "Your headline") + "</h1>" +
      '<div class="lead">' + ML("hero.lead", "", "A short introduction") + "</div>" +
      '<div class="cta"><a class="btn primary" href="#projects" data-act="view" data-v="projects">See my projects</a><a class="btn" href="#contact" data-act="view" data-v="contact">Get in touch</a></div>' +
      '<div class="waybill"><div class="bar"><span>Query · avg dwell by lane</span><span>T-SQL</span></div>' + (edit ? CODE("hero_sql") : '<pre class="code" style="background:none">' + data.hero_sql.split("\n").map(hlLine).join("\n") + "</pre>") + '<span class="stamp">Cleared</span></div>' +
      "</div>" + PHOTO("hero.photo", "", false, initials()) + "</div>";
    var sk = data.skills.map(function (s, i) {
      return '<article class="skill ' + cc(i) + '"><div class="top">' + T("skills." + i + ".name", "h3", "", "Skill") +
        (edit ? '<button class="pill s' + s.status + '" data-act="status" data-i="' + i + '">' + STATUS[s.status] + "</button>" : '<span class="pill s' + s.status + '">' + STATUS[s.status] + "</span>") +
        "</div>" + T("skills." + i + ".desc", "p", "", "What you do with it") + tools("skills", i, data.skills.length) + "</article>";
    }).join("");
    return h +
      '<section class="section"><div class="sechead"><span class="tagline c0">Toolkit</span><h2>' + T("skillsTitle", "span", "", "Section title") + '</h2></div><div class="skills">' + sk + "</div>" + addBtn("add-skill", "Add a skill") + "</section>" +
      '<section class="section two"><div style="display:grid;gap:12px"><span class="tagline c3">How I think about models</span><h2>' + T("model.title", "span", "", "Title") + '</h2><div class="muted">' + ML("model.text", "", "Explain your approach") + "</div></div>" +
      '<div class="model" role="img" aria-label="Star schema: fact_shipment surrounded by dim_date, dim_customer, dim_lane and dim_warehouse"><div class="gap"></div><div class="d1">dim_date</div><div class="gap"></div><div class="d2">dim_customer</div><div class="fact">fact_shipment</div><div class="d3">dim_lane</div><div class="gap"></div><div class="d4">dim_warehouse</div><div class="gap"></div></div></section>';
  }
  function tagList(s) { return String(s || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean); }
  function vProjects() {
    var all = {};
    data.projects.forEach(function (p) { tagList(p.tags).forEach(function (t) { all[t] = 1; }); });
    var names = Object.keys(all);
    if (filter !== "all" && !all[filter]) filter = "all";
    var chips = ["all"].concat(names).map(function (n) { return '<button class="chip" data-act="filter" data-f="' + esc(n) + '" aria-pressed="' + (n === filter) + '">' + (n === "all" ? "All" : esc(n)) + "</button>"; }).join("");
    var cards = data.projects.map(function (p, i) {
      if (!edit && filter !== "all" && tagList(p.tags).indexOf(filter) < 0) return "";
      var tags = edit ? T("projects." + i + ".tags", "p", "label", "Tags, separated by commas") : '<div class="tags">' + tagList(p.tags).map(function (t) { return '<span class="pill tag">' + esc(t) + "</span>"; }).join("") + "</div>";
      var link = edit ? T("projects." + i + ".link", "p", "label", "Link (GitHub, report, dashboard)") : (/^https?:\/\//.test(p.link || "") ? '<a href="' + esc(p.link) + '" target="_blank" rel="noopener">View project</a>' : "");
      var det = (edit || p.sql || p.notes) ? "<details" + (edit ? " open" : "") + "><summary>Approach and query</summary><div>" + ML("projects." + i + ".notes", "muted", "Findings and notes") + CODE("projects." + i + ".sql") + "</div></details>" : "";
      return '<article class="project ' + cc(i) + '"><div class="strip"></div>' + PHOTO("projects." + i + ".cover", "wide", true) +
        '<div class="in">' + T("projects." + i + ".area", "p", "label", "Area") + T("projects." + i + ".title", "h3", "", "Project title") + tags +
        ML("projects." + i + ".desc", "d", "What problem did it solve?") + link + det + tools("projects", i, data.projects.length) + "</div></article>";
    }).join("");
    return '<span class="tagline c1">Projects</span><h1 class="page" style="margin-top:10px">Work I can show</h1><div class="muted" style="max-width:40rem;margin-top:12px">' + ML("projectsIntro", "", "Intro") + "</div>" +
      '<div class="chips" style="margin-top:24px" role="group" aria-label="Filter projects">' + chips + '</div><div class="projects" style="margin-top:24px">' + cards + "</div>" + addBtn("add-project", "Add a project");
  }
  function vBlog() {
    var n = data.posts.length;
    var posts = data.posts.map(function (p, i) {
      var open = edit || openPosts[i];
      var more = open ? '<div class="more">' + ML("posts." + i + ".body", "", "Write your post") + CODE("posts." + i + ".code") + "</div>" : "";
      var tog = edit ? "" : '<button class="link-btn" data-act="post" data-i="' + i + '" aria-expanded="' + !!open + '">' + (open ? "Show less" : "Read more") + "</button>";
      return '<article class="post ' + cc(i) + '">' + T("posts." + i + ".date", "time", "", "Date") + '<div class="body">' + T("posts." + i + ".title", "h3", "", "Post title") + T("posts." + i + ".excerpt", "p", "excerpt", "One-line summary") + more + tog + tools("posts", i, n) + "</div></article>";
    }).join("");
    return '<span class="tagline c4">Blog</span><h1 class="page" style="margin-top:10px">Learning in public</h1><div class="muted" style="max-width:40rem;margin:12px 0 28px">' + ML("blogIntro", "", "Intro") + '</div><div class="posts">' + posts + "</div>" + addBtn("add-post", "Add a post");
  }
  function vAbout() {
    var a = data.about, n = a.areas.length;
    var areas = a.areas.map(function (x, i) {
      return '<div class="it ' + cc(i) + '"><b>' + T("about.areas." + i + ".title", "span", "", "Area") + "</b>" + T("about.areas." + i + ".desc", "span", "d", "Describe it") + tools("about.areas", i, n) + "</div>";
    }).join("");
    var g = a.gallery.map(function (x, i) {
      return "<figure>" + PHOTO("about.gallery." + i + ".id", "sq", false) + "<figcaption>" + T("about.gallery." + i + ".caption", "span", "", "Caption") + "</figcaption>" + tools("about.gallery", i, a.gallery.length) + "</figure>";
    }).join("");
    var gal = (edit || a.gallery.length) ? '<section class="section"><div class="sechead"><span class="tagline c2">Photos</span><h2>' + T("about.galleryTitle", "span", "", "Gallery title") + '</h2></div><div class="gallery">' + g + "</div>" + addBtn("add-photo", "Add a photo") + "</section>" : "";
    return '<span class="tagline c0">About</span><h1 class="page" style="margin:10px 0 28px">' + T("about.title", "span", "", "Headline") + '</h1><div class="about"><div class="text">' + PHOTO("about.photo", "", true) + ML("about.text", "", "Tell your story") +
      '</div><div><p class="label" style="margin-bottom:16px">' + T("about.areasTitle", "span", "", "Section title") + '</p><div class="timeline">' + areas + "</div>" + addBtn("add-area", "Add an area") + "</div></div>" + gal;
  }
  function vContact() {
    var c = data.contact;
    var items = [["email", "Email", "Copy email"], ["linkedin", "LinkedIn", "Copy link"], ["github", "GitHub", "Copy link"]].map(function (x, i) {
      return '<div class="contact ' + cc(i) + '"><span class="label">' + x[1] + "</span>" + T("contact." + x[0], "span", "val", x[1]) + '<button class="btn" data-act="copy" data-text="' + esc(c[x[0]]) + '">' + x[2] + "</button></div>";
    }).join("");
    return '<span class="tagline c3">Contact</span><h1 class="page" style="margin:10px 0 12px">Let\'s talk about data</h1><div class="muted" style="max-width:40rem;margin-bottom:28px">' + ML("contact.intro", "", "Intro") + '</div><div class="contacts">' + items + '</div><p class="note" id="copy-status" role="status" style="margin-top:16px"></p>';
  }

  function render(keepScroll) {
    var nav = VIEWS.map(function (v) { return '<a href="#' + v[0] + '" data-act="view" data-v="' + v[0] + '"' + (v[0] === view ? ' aria-current="page"' : "") + ">" + v[1] + "</a>"; }).join("");
    var body = { home: vHome, projects: vProjects, blog: vBlog, about: vAbout, contact: vContact }[view]();
    root.innerHTML = '<div class="wrap"><header class="top"><div class="brand">' + T("name", "span", "", "Your name") + "<small>" + T("role", "span", "", "Your role") + '</small></div><nav aria-label="Main">' + nav + '</nav></header><div class="band"></div><main class="view">' + body + '</main><footer class="foot"><span>' + esc(data.name) + " · Data analytics portfolio</span><span>Built with SQL, Excel, Power BI and curiosity</span></footer></div>";
    if (!keepScroll) window.scrollTo(0, 0);
  }
  function updBar() {
    if (!canEdit) { barEl.hidden = true; return; }
    barEl.hidden = false;
    if (!edit) { barEl.innerHTML = '<span class="msg">' + esc(msgText || "You can edit this page.") + '</span><button class="btn primary" data-act="edit">Edit page</button>'; return; }
    barEl.innerHTML = '<span class="msg">' + esc(msgText || "Editing: click any text to change it. Nothing is public until you save.") + '</span><button class="btn" data-act="discard">Discard</button><button class="btn" data-act="backup">Copy backup</button><button class="btn primary" data-act="save">Save changes</button>' + (backup ? '<textarea id="bk" readonly>' + esc(backup) + "</textarea>" : "");
    var bk = document.getElementById("bk"); if (bk) { bk.focus(); bk.select(); }
  }
  function msg(t) { msgText = t; updBar(); }

  // photos
  function pickFile(cb) { var i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.onchange = function () { if (i.files && i.files[0]) cb(i.files[0]); }; i.click(); }
  function shrink(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? res(b) : rej(new Error("resize")); }, "image/jpeg", 0.86);
      };
      img.onerror = function () { rej(new Error("read")); };
      img.src = url;
    });
  }
  function uploadPhoto(file) {
    if (!assets) { msg("Photo upload is not available in this view."); return Promise.reject(new Error("no assets")); }
    msg("Uploading photo…");
    return shrink(file).then(function (b) { return assets.upload(b, { type: "image/jpeg" }); }).then(function (r) { msg(""); return r.id; }).catch(function (e) {
      msg(e && e.message === "read" ? "That photo could not be read. Use a JPG or PNG file." : "Photo upload failed. Try a smaller JPG or PNG.");
      throw e;
    });
  }

  // saving
  function buildDoc() {
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app-script").textContent;
    var json = JSON.stringify(data, null, 1).replace(/</g, "\\u003c");
    return HEAD_OPEN + RESET + HEAD_CLOSE + "<title>" + TITLE + "</title>\n" + '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="stylesheet" href="' + FONT_LINK + '">\n' + '<style id="app-style">' + css + "</style>\n" +
      '<div id="root"></div><div id="bar" hidden></div>\n' +
      '<script type="application/json" id="site-data">' + json + "<\/script>\n" +
      '<script id="app-script">' + js + "<\/script>" + TAIL;
  }
  function save() {
    if (!art) { msg("Saving is not available in this view. Use Copy backup and send it to Claude."); return; }
    var js = document.getElementById("app-script").textContent;
    if (js.indexOf("DD_APP_MARKER") < 0) { msg("The page source could not be read, so nothing was saved. Use Copy backup and send it to Claude."); return; }
    msg("Saving…");
    try { sessionStorage.setItem("dd-view", view); } catch (e) {}
    art.publish(buildDoc()).then(function () { msg("Saved."); }).catch(function (e) {
      var c = e && e.code;
      if (c === "conflict") msg("The page was updated elsewhere, so it is reloading. Make your changes again.");
      else if (c === "not_writer" || c === "not_granted") msg("This view cannot save. Open the page from your own account.");
      else if (c === "rate_limited") msg("Saving too often. Wait a moment and try again.");
      else msg("Saving failed" + (c ? " (" + c + ")" : "") + ". Use Copy backup and send it to Claude.");
    });
  }

  // events
  var armTimer = null;
  document.addEventListener("input", function (e) {
    var t = e.target; if (!t || !t.dataset || !t.dataset.path) return;
    set(t.dataset.path, t.innerText.replace(/ /g, " ").replace(/\n$/, ""));
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target; if (!t || !t.classList || !t.classList.contains("ed") || e.key !== "Enter") return;
    e.preventDefault();
    if (t.classList.contains("ml")) document.execCommand("insertText", false, "\n");
  });
  document.addEventListener("paste", function (e) {
    var t = e.target; if (!t || !t.closest || !t.closest(".ed")) return;
    e.preventDefault();
    var s = (e.clipboardData || window.clipboardData).getData("text/plain");
    if (!t.closest(".ml")) s = s.replace(/\s*\n\s*/g, " ");
    document.execCommand("insertText", false, s);
  });
  function newPost() { return { date: new Date().toLocaleDateString("en-ZA", { day: "numeric", month: "short", year: "numeric" }), title: "New post", excerpt: "A one-line summary of the post.", body: "Write your post here.", code: "" }; }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-act]") : null; if (!t) return;
    var a = t.dataset.act, i = +t.dataset.i, L;
    if (a === "view") { e.preventDefault(); view = t.dataset.v; try { history.replaceState(null, "", "#" + view); } catch (x) {} render(); return; }
    if (a === "filter") { filter = t.dataset.f; render(true); return; }
    if (a === "post") { openPosts[i] = !openPosts[i]; render(true); return; }
    if (a === "copy") {
      var txt = t.dataset.text, st = document.getElementById("copy-status");
      var done = function (ok) { if (st) st.textContent = ok ? "Copied: " + txt : "Select the text above and copy it."; };
      try { navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); }); } catch (x) { done(false); }
      return;
    }
    if (a === "edit") { edit = true; msgText = ""; render(true); updBar(); return; }
    if (a === "discard") { data = JSON.parse(origJson); edit = false; dirty = false; msgText = ""; backup = ""; render(true); updBar(); return; }
    if (a === "save") { save(); return; }
    if (a === "backup") {
      var j = JSON.stringify(data);
      try { navigator.clipboard.writeText(j).then(function () { msg("Backup copied. Paste it into a message to Claude if you need it restored."); }, function () { backup = j; updBar(); }); } catch (x) { backup = j; updBar(); }
      return;
    }
    if (!edit) return;
    if (a === "status") { data.skills[i].status = (data.skills[i].status + 1) % 3; dirty = true; render(true); return; }
    if (a === "photo") { var p = t.dataset.path; pickFile(function (f) { uploadPhoto(f).then(function (id) { set(p, id); render(true); }, function () {}); }); return; }
    if (a === "add-photo") { pickFile(function (f) { uploadPhoto(f).then(function (id) { data.about.gallery.push({ id: id, caption: "Add a caption" }); dirty = true; render(true); }, function () {}); }); return; }
    if (a === "add-skill") { data.skills.push({ name: "New skill", status: 2, desc: "What you do with it." }); dirty = true; render(true); return; }
    if (a === "add-project") { data.projects.push({ title: "New project", area: "Area", tags: "SQL", cover: null, desc: "Describe the problem and what you built.", sql: "", notes: "", link: "" }); dirty = true; render(true); return; }
    if (a === "add-post") { data.posts.unshift(newPost()); dirty = true; render(true); return; }
    if (a === "add-area") { data.about.areas.push({ title: "New area", desc: "Describe it." }); dirty = true; render(true); return; }
    if (a === "up" || a === "down" || a === "del") {
      L = t.dataset.list.split(".").reduce(function (o, k) { return o[k]; }, data);
      if (a === "del") {
        if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Click again to delete"; clearTimeout(armTimer); armTimer = setTimeout(function () { t.classList.remove("armed"); t.textContent = "Delete"; }, 3000); return; }
        L.splice(i, 1);
      } else {
        var j2 = a === "up" ? i - 1 : i + 1; if (j2 < 0 || j2 >= L.length) return;
        var tmp = L[i]; L[i] = L[j2]; L[j2] = tmp;
      }
      dirty = true; render(true);
    }
  });

  // start
  try { var h = (location.hash || "").replace("#", ""); var sv = null; try { sv = sessionStorage.getItem("dd-view"); sessionStorage.removeItem("dd-view"); } catch (x) {} var s0 = h || sv; if (s0 && VIEWS.some(function (v) { return v[0] === s0; })) view = s0; } catch (e) {}
  render(true);
  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use("user"), window.claude.use("artifact"), window.claude.use("assets")]).then(function (r) {
      art = r[1]; assets = r[2];
      return r[0] && art ? r[0].canEdit() : false;
    }).then(function (ok) { canEdit = !!ok; updBar(); }).catch(function () {});
  }
})();
</script>
</body>
</html>
